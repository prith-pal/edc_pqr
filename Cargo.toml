[package]
name = "edc_pqr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Post-quantum resistant encryption, decryption, and key generation from the command line. Easy to use, with sane defaults."
license = "MIT OR Apache-2.0"
repository = "https://github.com/prith-pal/edc_pqr"
readme = "README.md"
keywords = ["post-quantum", "cryptography", "encryption", "keygen", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4", features = ["derive"] }
